experiment_name: "canada_fraud_detection_v1"
data:
  train_csv: "data/transactions_sample.csv"
  target: "label_fraud"
  id_col: "transaction_id"
  datetime_col: "timestamp"
  categorical: ["merchant_category","channel","country"]
  numerical: ["amount","customer_age","customer_tenure_months","is_night"]
model:
  type: "catboost"
  params:
    loss_function: "Logloss"
    depth: 8
    learning_rate: 0.06
    iterations: 800
    l2_leaf_reg: 3.0
    random_seed: 42
training:
  test_size: 0.2
  random_state: 42
  metrics: ["roc_auc","average_precision","f1"]
compliance:
  pii_minimization: true
  explainability: true
  threshold: 0.5
